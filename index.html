<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đại Nam Lược Sử - Kỷ nguyên Minh Mạng</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
    :root { --gold: #ffd700; --dark-red: #5a0000; --royal-red: #8b0000; --paper: #f4e4bc; }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle, var(--royal-red), var(--dark-red), #000);
        color: var(--paper); text-align: center; margin: 0;
        min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
        align-items: center; padding: 20px 10px; box-sizing: border-box;
    }

    .game-box {
        background: url('https://www.transparenttextures.com/patterns/aged-paper.png'), #2a0800;
        padding: 30px 25px; border-radius: 15px; width: 100%; max-width: 800px;
        max-height: 90vh; overflow-y: auto; overflow-x: hidden; 
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 20px #000;
        border: 3px solid var(--gold); position: relative; animation: fadeIn 0.8s ease-in-out;
        box-sizing: border-box;
    }

    .game-box::-webkit-scrollbar { width: 8px; }
    .game-box::-webkit-scrollbar-track { background: #4a0e00; border-radius: 10px; }
    .game-box::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 4px #000; margin-top: 0; font-size: 28px;}
    .subtitle { font-style: italic; color: #ddd; margin-bottom: 20px; font-size: 14px; }
    
    #q-image { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 2px solid var(--gold); margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); display: none; }
    #question { font-size: 19px; font-weight: bold; margin-bottom: 20px; line-height: 1.5; color: #fff; text-align: left; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; border-left: 5px solid var(--gold);}

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .choices button {
        padding: 15px; border: 2px solid #b8860b; border-radius: 8px;
        background: linear-gradient(180deg, #4a0e00, #2a0800); color: var(--gold);
        font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s;
        box-shadow: 3px 3px 10px rgba(0,0,0,0.5); text-align: left; line-height: 1.4;
    }
    .choices button:hover:not(:disabled) { background: linear-gradient(180deg, #6a1500, #4a0e00); transform: translateY(-2px); box-shadow: 0 0 15px var(--gold); }
    .choices button.correct { background: #006400 !important; color: white !important; border-color: #00ff00 !important; animation: pulse 0.5s; box-shadow: 0 0 20px #00ff00 !important; }
    .choices button.wrong { background: #8b0000 !important; color: white !important; border-color: #ff0000 !important; box-shadow: 0 0 20px #ff0000 !important;}
    .choices button:disabled { opacity: 0.8; cursor: not-allowed; }

    .action-btn { background: var(--gold); color: #000; font-size: 18px; padding: 12px 30px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); transition: 0.3s; margin-top: 20px; display: inline-block;}
    .action-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }

    /* MÀN HÌNH THÀNH CÔNG (TÔNG SÁNG MỚI) */
    #success-screen { display: none; text-align: center; animation: zoomIn 0.5s ease-out; }
    .success-box {
        background: radial-gradient(circle, rgba(0,80,0,0.9), rgba(0,40,0,0.9));
        border: 3px solid #00ffcc; padding: 25px; border-radius: 15px;
        box-shadow: 0 0 40px rgba(0, 255, 204, 0.4), inset 0 0 20px #000;
        margin-top: 10px;
    }
    #success-desc { font-size: 20px; line-height: 1.6; color: #fff; text-shadow: 1px 1px 3px #000;}

    /* HIỆU ỨNG CHIẾN ĐẤU & GAME OVER */
    #battle-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); z-index: 100; display: none; justify-content: center; align-items: center; overflow: hidden; }
    .sword { font-size: 150px; position: absolute; text-shadow: 0 0 20px #fff; }
    .sword-left { left: -200px; transform: rotate(45deg); animation: slashLeft 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    .sword-right { right: -200px; transform: rotate(-45deg) scaleX(-1); animation: slashRight 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    .blood-flash { animation: bloodScreen 0.8s ease-out forwards; }

    @keyframes slashLeft { 100% { left: 35%; transform: rotate(45deg) translate(-20px, 20px); } }
    @keyframes slashRight { 100% { right: 35%; transform: rotate(-45deg) scaleX(-1) translate(-20px, 20px); } }
    @keyframes bloodScreen { 0% { background: rgba(0,0,0,0.9); } 20% { background: rgba(255, 0, 0, 0.7); } 100% { background: rgba(0,0,0,1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } }
    .shake { animation: shake 0.4s; }

    #game-content { display: none; animation: fadeIn 0.5s; }
    #progress { color: var(--gold); font-size: 16px; margin-bottom: 15px; text-align: left; font-weight: bold; border-bottom: 1px solid #666; padding-bottom: 10px;}
    
    @media (max-width: 600px) { .choices { grid-template-columns: 1fr; } h1 { font-size: 22px; } #q-image { height: 160px; } }
</style>
</head>
<body>

<audio id="bgm" src="sounds/bgm.mp3" loop preload="auto"></audio>
<audio id="sfx-correct" src="sounds/correct.mp3" preload="auto"></audio>
<audio id="sfx-wrong" src="sounds/wrong.mp3" preload="auto"></audio>
<audio id="sfx-sword" src="sounds/sword.mp3" preload="auto"></audio>
<audio id="sfx-death" src="sounds/death.mp3" preload="auto"></audio>

<div id="battle-overlay">
    <div class="sword sword-left">🗡️</div>
    <div class="sword sword-right">🗡️</div>
</div>

<div class="game-box" id="main-box">
    <h1>👑 Triều Chính Minh Mạng</h1>
    <div class="subtitle">Bản Đồ Quyền Lực 1820 - 1840</div>
    
    <!-- MÀN HÌNH CHỜ BẮT ĐẦU -->
    <div id="start-screen">
        <p style="font-size: 18px; line-height: 1.6;">"Bẩm Hoàng thượng, 7 tấu chương khẩn cấp đang chờ ngài phê duyệt. Xin cẩn trọng, quần thần và giặc ngoại bang đều đang nhòm ngó ngai vàng!"</p>
        <button class="action-btn" onclick="startGame()">Thượng Triều (Bắt Đầu)</button>
    </div>

    <!-- MÀN HÌNH CÂU HỎI -->
    <div id="game-content">
        <div id="progress">Trang sớ: 1 / 7</div>
        <img id="q-image" src="" alt="Hình minh họa">
        <div id="question"></div>
        <div class="choices" id="choices"></div>
    </div>

    <!-- MÀN HÌNH TRẢ LỜI ĐÚNG (TÔNG SÁNG ĐẸP) -->
    <div id="success-screen">
        <h2 style="color: #00ffcc; font-size: 32px; text-shadow: 0 0 15px #00ffcc; margin-top: 0;">✨ THÁNH MINH ✨</h2>
        <div class="success-box">
            <div id="success-desc"></div>
        </div>
        <button class="action-btn" onclick="nextQuestion()">Phê Duyệt Tấu Chương Tiếp Theo ➔</button>
    </div>

    <!-- MÀN HÌNH THẤT BẠI (GAME OVER) -->
    <div id="end-screen" style="display: none; animation: zoomIn 0.5s;">
        <h2 id="final-title" style="font-size: 35px; text-shadow: 0 0 20px red;"></h2>
        <p id="final-desc" style="font-size: 19px; line-height: 1.6; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; border: 1px solid #ff4d4d;"></p>
        <button class="action-btn" onclick="location.reload()">Trùng Hưng Triều Đại (Chơi lại)</button>
    </div>
</div>

<script>
function playSound(id, maxDurationMs = 0) {
    const sound = document.getElementById(id);
    if(sound) {
        sound.pause(); sound.currentTime = 0;
        let playPromise = sound.play();
        if (playPromise !== undefined) { playPromise.catch(e => console.warn(e)); }
        if(maxDurationMs > 0) { setTimeout(() => { sound.pause(); sound.currentTime = 0; }, maxDurationMs); }
    }
}

let current = 0;
let isGameOver = false;

function startGame() {
    playSound('bgm');
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("game-content").style.display = "block";
    loadQuestion();
}

function loadQuestion() {
    const q = questions[current];
    document.getElementById("progress").innerText = `Trang sớ: ${current + 1} / ${questions.length}`;
    document.getElementById("q-image").src = q.image;
    document.getElementById("q-image").style.display = "block";
    document.getElementById("question").innerText = q.text;
    
    const choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";
    q.choices.forEach((choiceObj) => {
        const btn = document.createElement("button");
        btn.innerText = choiceObj.text;
        btn.onclick = () => checkAnswer(choiceObj, btn);
        choicesDiv.appendChild(btn);
    });
    
    document.getElementById("main-box").scrollTo({ top: 0, behavior: 'smooth' });
}

function checkAnswer(choiceObj, btnElement) {
    if(isGameOver) return;
    const buttons = document.querySelectorAll('.choices button');
    buttons.forEach(b => b.disabled = true); // Khóa nút ngay lập tức

    if (choiceObj.type === "correct") {
        playSound('sfx-correct', 3000);
        btnElement.classList.add("correct");
        
        // Đợi 0.8 giây để khán giả nhìn thấy nút xanh, sau đó chuyển sang BẢNG THÀNH CÔNG
        setTimeout(() => {
            document.getElementById("game-content").style.display = "none";
            const successScreen = document.getElementById("success-screen");
            successScreen.style.display = "block";
            document.getElementById("success-desc").innerHTML = choiceObj.explain;
            document.getElementById("main-box").scrollTo({ top: 0, behavior: 'smooth' });
        }, 800);

    } else if (choiceObj.type === "fatal") {
        isGameOver = true;
        triggerBattleScene(choiceObj.explain); // Ám sát: Nhảy ra chém nhau
    } else {
        isGameOver = true;
        playSound('sfx-wrong', 3000);
        btnElement.classList.add("wrong");
        document.getElementById("main-box").classList.add("shake");
        
        // Đợi 1.5 giây để nhìn nút đỏ rung lắc, rồi hiện BẢNG GAME OVER bình thường
        setTimeout(() => {
            showLoseScreen(choiceObj.explain, false);
        }, 1500);
    }
}

function nextQuestion() {
    document.getElementById("success-screen").style.display = "none"; // Tắt bảng Thành công
    current++;
    if (current < questions.length) {
        document.getElementById("game-content").style.display = "block"; // Bật lại bảng Câu hỏi
        loadQuestion();
    } else {
        showWinScreen(); // Hết 7 câu thì Thắng game
    }
}

function triggerBattleScene(fatalMessage) {
    document.getElementById("bgm").pause(); 
    document.getElementById("main-box").classList.add("shake");
    const battleOverlay = document.getElementById("battle-overlay");
    battleOverlay.style.display = "flex";
    
    playSound('sfx-sword', 2500);

    setTimeout(() => { battleOverlay.classList.add("blood-flash"); }, 300);

    setTimeout(() => {
        battleOverlay.style.display = "none";
        battleOverlay.classList.remove("blood-flash");
        showLoseScreen(fatalMessage, true);
        playSound('sfx-death', 6000); // Tiếng thét băng hà
    }, 2500);
}

function showLoseScreen(msg, isFatal) {
    document.getElementById("game-content").style.display = "none";
    const endScreen = document.getElementById("end-screen");
    endScreen.style.display = "block";
    document.getElementById("final-title").innerText = isFatal ? "🩸 BĂNG HÀ 🩸" : "🏴 QUỐC GIA SỤP ĐỔ 🏴";
    document.getElementById("final-desc").innerText = msg;
    document.getElementById("main-box").scrollTo({ top: 0, behavior: 'smooth' });
}

function showWinScreen() {
    const endScreen = document.getElementById("end-screen");
    endScreen.style.display = "block";
    document.getElementById("final-title").innerText = "🎉 THÁNH CUNG VẠN TUẾ 🎉";
    document.getElementById("final-title").style.color = "#00ffcc";
    document.getElementById("final-title").style.textShadow = "0 0 20px #00ffcc";
    document.getElementById("final-desc").style.border = "1px solid #00ffcc";
    document.getElementById("final-desc").innerText = `Đại Nam Hưng Thịnh! Qua 7 đạo sớ, ngài đã chứng minh được sự vĩ đại của Hoàng đế Minh Mạng. Lịch sử đã ghi danh Ngài!`;
    document.getElementById("main-box").scrollTo({ top: 0, behavior: 'smooth' });
    
    let duration = 5 * 1000;
    let end = Date.now() + duration;
    (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
}
</script>
</body>
</html>
